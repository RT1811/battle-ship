<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
</head>
<body>
  <h1>Battleship</h1>
  <p id="status"></p>

  <div id="setup-phase">
    <h2>Place Your Ships</h2>
    <div id="ship-tray">
      <div class="draggable-ship" draggable="true" data-length="2">Ship (2)</div>
      <div class="draggable-ship" draggable="true" data-length="3">Ship (3)</div>
      <div class="draggable-ship" draggable="true" data-length="3">Ship (3)</div>
      <div class="draggable-ship" draggable="true" data-length="4">Ship (4)</div>
      <div class="draggable-ship" draggable="true" data-length="5">Ship (5)</div>
    </div>
    <button type="button" id="rotate-btn">Rotate: Horizontal</button>
    <div id="setup-board" class="board"></div>
    <button type="button" id="start-game-btn" disabled>Start Game</button>
  </div>

  <div id="game-phase" class="boards hidden">
    <div>
      <h2>Your Board</h2>
      <div id="player-board" class="board"></div>
    </div>
    <div>
      <h2>Enemy Board</h2>
      <div id="enemy-board" class="board"></div>
    </div>
  </div>
</body>
</html>
